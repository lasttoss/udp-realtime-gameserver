name: ci

on:
  push:
    branches: [master, main]
    # A tag is what gives a released image its version; the branch gives it `latest` and its commit.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | tee /dev/stderr | wc -l | grep -qx 0
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the relay container
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test over HTTP and UDP
        run: python3 scripts/smoke.py 127.0.0.1 8080 127.0.0.1 9000
      - name: A short load test
        run: go run ./cmd/botswarm -gateway http://127.0.0.1:8080 -relay 127.0.0.1:9000 -ccu 100 -ramp 3s -duration 5s
      - name: Logs
        if: always()
        run: docker compose logs relay

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint the chart
        run: helm lint deploy/helm/udp-relay
      - name: Render the defaults and every optional feature
        run: |
          helm template arena deploy/helm/udp-relay > /tmp/default.yaml
          helm template arena deploy/helm/udp-relay \
            --set autoscaling.enabled=true \
            --set prometheus.serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set service.udp.enabled=true \
            --set http.hostPort.enabled=true \
            --set secret.existingSecret=byo-secret \
            --set advertisePodIP=false \
            --set extraEnv[0].name=RELAY_ADVERTISE \
            --set extraEnv[0].value=relay.example.com:9000 > /tmp/full.yaml
          # A duplicated env name or a container port without a name is the kind of thing a render
          # hides and a cluster refuses, so the render is checked for both.
          ! grep -c 'name: RELAY_ADVERTISE' /tmp/default.yaml | grep -qx 0
      - name: Validate the rendered objects against the Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/default.yaml /tmp/full.yaml

      - name: What is running
        if: always()
        run: docker compose ps


  image:
    # Only a push publishes. A pull request from a fork cannot write to the registry anyway, and a
    # pull request from a branch would be noise in a package nobody asked for.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 becomes 1.2.3 and 1.2, the branch becomes `master`, and the default branch also
          # gets `latest`; the commit short sha is there so an image can always be traced back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both architectures: the Dockerfile honours TARGETARCH, so the only cost is a second
          # build under emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image that says what it was built from, and a list of what is inside it.
          provenance: true
          sbom: true
