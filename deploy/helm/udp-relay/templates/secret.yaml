{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $value := .Values.secret.value | default (printf "%s-ticket-signing-key" (include "udp-relay.fullname" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udp-relay.secretName" . }}
  labels:
    {{- include "udp-relay.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # The relay only verifies tickets with this; the gateway mints them with it in the same process.
  RELAY_SECRET: {{ $value | quote }}
{{- end }}
